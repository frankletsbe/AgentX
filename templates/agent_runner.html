<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NSW Holiday Parks Agent Runner</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          "Inter",
          -apple-system,
          BlinkMacSystemFont,
          sans-serif;
        background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
        color: #e2e8f0;
        min-height: 100vh;
        padding: 20px;
      }

      .container {
        max-width: 1800px;
        margin: 0 auto;
      }

      header {
        text-align: center;
        margin-bottom: 30px;
        padding: 30px 20px;
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }

      h1 {
        font-size: 2.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, #60a5fa 0%, #a78bfa 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-bottom: 10px;
      }

      .subtitle {
        color: #94a3b8;
        font-size: 1.1rem;
      }

      .controls {
        text-align: center;
        margin-bottom: 30px;
      }

      .btn {
        background: linear-gradient(135deg, #3b82f6 0%, #8b5cf6 100%);
        color: white;
        border: none;
        padding: 14px 40px;
        font-size: 1rem;
        font-weight: 600;
        border-radius: 12px;
        cursor: pointer;
        transition: all 0.3s ease;
        box-shadow: 0 4px 20px rgba(59, 130, 246, 0.3);
      }

      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 30px rgba(59, 130, 246, 0.4);
      }

      .btn:active {
        transform: translateY(0);
      }

      .btn:disabled {
        background: #475569;
        cursor: not-allowed;
        box-shadow: none;
      }

      .status-badge {
        display: inline-block;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 0.875rem;
        font-weight: 600;
        margin-left: 15px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }

      .status-idle {
        background: rgba(148, 163, 184, 0.2);
        color: #94a3b8;
      }

      .status-running {
        background: rgba(251, 191, 36, 0.2);
        color: #fbbf24;
        animation: pulse 2s ease-in-out infinite;
      }

      .status-completed {
        background: rgba(34, 197, 94, 0.2);
        color: #22c55e;
      }

      .status-error {
        background: rgba(239, 68, 68, 0.2);
        color: #ef4444;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.6;
        }
      }

      .content-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
      }

      .panel {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 16px;
        padding: 25px;
        border: 1px solid rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        height: calc(100vh - 350px);
        display: flex;
        flex-direction: column;
      }

      .panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        padding-bottom: 15px;
        border-bottom: 2px solid rgba(255, 255, 255, 0.1);
      }

      .panel-title {
        font-size: 1.25rem;
        font-weight: 600;
        color: #f1f5f9;
      }

      .panel-icon {
        font-size: 1.5rem;
      }

      .panel-content {
        flex: 1;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.3);
        border-radius: 12px;
        padding: 20px;
        font-family: "Monaco", "Courier New", monospace;
        font-size: 0.9rem;
        line-height: 1.6;
      }

      .panel-content::-webkit-scrollbar {
        width: 8px;
      }

      .panel-content::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 4px;
      }

      .panel-content::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 4px;
      }

      .panel-content::-webkit-scrollbar-thumb:hover {
        background: rgba(255, 255, 255, 0.3);
      }

      #finalResult {
        white-space: pre-wrap;
        color: #e2e8f0;
      }

      #terminalOutput {
        white-space: pre-wrap;
        color: #94a3b8;
        font-size: 0.85rem;
      }

      .empty-state {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        color: #64748b;
        text-align: center;
      }

      .empty-state-icon {
        font-size: 3rem;
        margin-bottom: 15px;
        opacity: 0.5;
      }

      .loading-dots {
        display: inline-block;
      }

      .loading-dots::after {
        content: "...";
        animation: dots 1.5s steps(4, end) infinite;
      }

      @keyframes dots {
        0%,
        20% {
          content: ".";
        }
        40% {
          content: "..";
        }
        60%,
        100% {
          content: "...";
        }
      }

      @media (max-width: 1200px) {
        .content-grid {
          grid-template-columns: 1fr;
        }

        .panel {
          height: 500px;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <header>
        <h1>🏖️ NSW Holiday Parks Agent</h1>
        <p class="subtitle">
          AI-powered holiday park search and recommendations
        </p>
      </header>

      <div class="controls">
        <button id="startBtn" class="btn" onclick="startAgent()">
          🚀 Run Agent
        </button>
        <span id="statusBadge" class="status-badge status-idle">Idle</span>
      </div>

      <div class="content-grid">
        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">📋 Final Results</span>
            <span class="panel-icon">✨</span>
          </div>
          <div class="panel-content" id="finalResult">
            <div class="empty-state">
              <div class="empty-state-icon">🎯</div>
              <p>Click "Run Agent" to start searching for holiday parks</p>
            </div>
          </div>
        </div>

        <div class="panel">
          <div class="panel-header">
            <span class="panel-title">💻 Terminal Output</span>
            <span class="panel-icon">⚡</span>
          </div>
          <div class="panel-content" id="terminalOutput">
            <div class="empty-state">
              <div class="empty-state-icon">📡</div>
              <p>Waiting for agent execution...</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let eventSource = null;

      function updateStatus(status) {
        const badge = document.getElementById("statusBadge");
        badge.className = "status-badge status-" + status;
        badge.textContent = status.charAt(0).toUpperCase() + status.slice(1);
      }

      function startAgent() {
        const btn = document.getElementById("startBtn");
        const finalResult = document.getElementById("finalResult");
        const terminalOutput = document.getElementById("terminalOutput");

        btn.disabled = true;
        updateStatus("running");

        finalResult.innerHTML =
          '<div class="empty-state"><div class="empty-state-icon">⏳</div><p>Agent is processing<span class="loading-dots"></span></p></div>';
        terminalOutput.textContent = "";

        // Start the agent
        fetch("/start")
          .then((response) => response.json())
          .then((data) => {
            console.log("Agent started:", data);

            // Connect to the event stream
            eventSource = new EventSource("/stream");

            eventSource.onmessage = function (event) {
              const data = JSON.parse(event.data);

              if (data.type === "output") {
                terminalOutput.textContent += data.data;
                terminalOutput.scrollTop = terminalOutput.scrollHeight;
              } else if (data.type === "complete") {
                finalResult.textContent = data.data.content;
                updateStatus(data.data.status);
                btn.disabled = false;
                eventSource.close();
              } else if (data.type === "error") {
                finalResult.innerHTML = `<div style="color: #ef4444;">Error: ${data.data}</div>`;
                updateStatus("error");
                btn.disabled = false;
                eventSource.close();
              }
            };

            eventSource.onerror = function (error) {
              console.error("EventSource error:", error);
              eventSource.close();
              btn.disabled = false;
              updateStatus("error");
            };
          })
          .catch((error) => {
            console.error("Error starting agent:", error);
            finalResult.innerHTML = `<div style="color: #ef4444;">Failed to start agent: ${error.message}</div>`;
            updateStatus("error");
            btn.disabled = false;
          });
      }
    </script>
  </body>
</html>
